name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: booking_test_only
          POSTGRES_DB: booking_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:booking_test_only@127.0.0.1:5432/booking_test
      TEST_DATABASE_URL: postgresql://postgres:booking_test_only@127.0.0.1:5432/booking_test
      APP_ENVIRONMENT: staging
      PAYMENTS_ENABLED: 'false'
      STORAGE_BACKEND: postgres
      STAGING_BROWSER_TEST: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BOOKING_TEST_BASE_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-auth-only-independent-secret-for-ephemeral-database-not-production
      SELF_CANCEL_HMAC_SECRET: ci-test-only-secret-for-ephemeral-database-not-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run build
      - run: npm run check:runtime-traces
      - run: npx playwright install --with-deps chromium
      - name: Prepare browser scenario
        run: |
          ALLOW_DEMO_SEED=true npm run db:seed > seed.log
          node -e "const fs=require('node:fs');const eol=String.fromCharCode(10);const path=fs.readFileSync('seed.log','utf8').trim().split(eol).at(-1);fs.appendFileSync(process.env.GITHUB_ENV,'BOOKING_TEST_PATH='+path+eol);"
      - run: npm run test:e2e

      - name: Summarize verification
        if: always()
        run: npm run test:summary

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            qa-results/
          if-no-files-found: ignore
