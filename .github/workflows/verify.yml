name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: booking_test_only
          POSTGRES_DB: booking_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:booking_test_only@127.0.0.1:5432/booking_test
      TEST_DATABASE_URL: postgresql://postgres:booking_test_only@127.0.0.1:5432/booking_test
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      SELF_CANCEL_HMAC_SECRET: ci-test-only-secret-for-ephemeral-database-not-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Prepare browser scenario
        run: |
          ALLOW_DEMO_SEED=true npm run db:seed > seed.log
          node -e "const fs=require('node:fs');const eol=String.fromCharCode(10);const path=fs.readFileSync('seed.log','utf8').trim().split(eol).at(-1);fs.appendFileSync(process.env.GITHUB_ENV,'BOOKING_TEST_PATH='+path+eol);"
      - run: npm run test:e2e
